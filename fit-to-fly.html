<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surat Fit To Fly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: clinical, calm, quick to use between patients.
   IDEA: a prescription pad beside the letter it produces.
   PICTURE: the A4 letter itself, updating live as the form is filled.
   COLOUR and TYPE: white paper, dark ink, one deep rose accent; Archivo, large sizes.
   LAYOUT: form column left, paper right; stacks to form then paper under 900px. */
:root{color-scheme:light;--bg:#f6f5f3;--paper:#fff;--ink:#1b1c1e;--muted:#5d6066;--line:#d9d7d2;--accent:#a3243f;--warn:#8a4b00;--warnbg:#fff4e0}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 Archivo,system-ui,sans-serif;overflow-x:clip}
header{padding:28px max(5vw,16px) 8px;max-width:1300px;margin:auto}
h1{font-size:clamp(30px,4vw,44px);line-height:1.05;margin:0 0 6px;font-weight:800;text-wrap:balance}
header p{margin:0;color:var(--muted)}
main{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:32px;padding:20px max(5vw,16px) 48px;max-width:1300px;margin:auto;align-items:start}
form{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px}
label{display:block;font-weight:600;margin:0 0 6px}
.f{margin-bottom:18px}
.hint{font-weight:400;color:var(--muted);font-size:14px;margin-top:4px}
input{width:100%;font:inherit;font-size:18px;padding:11px 12px;min-height:50px;border:1.5px solid #b9b6b0;border-radius:9px;background:#fff;color:var(--ink)}
input:focus{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.calc{background:#f3eef0;border-radius:9px;padding:10px 12px;font-size:16px;margin:-6px 0 18px}
.calc b{color:var(--accent)}
#warn{display:none;background:var(--warnbg);color:var(--warn);border-radius:9px;padding:10px 12px;font-size:16px;margin-bottom:18px}
#warn ul{margin:0;padding-left:20px}
button{font:inherit;font-weight:800;font-size:19px;width:100%;min-height:56px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:hover{filter:brightness(1.08)}button:focus-visible{outline:3px solid #000;outline-offset:3px}
button.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);min-height:46px;font-size:16px;margin-top:10px}
#status{min-height:1.5em;margin-top:10px;font-size:16px;color:var(--muted)}
.paperwrap{position:sticky;top:20px}
.paper{background:var(--paper);aspect-ratio:210/297;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.08);padding:12% 12%;font-family:Arial,Helvetica,sans-serif;font-size:clamp(10px,1.35vw,15px);line-height:1.65;color:#111;container-type:inline-size}
.paper h2{text-align:center;font-size:1.1em;margin:2.5em 0 2.6em;font-weight:700}
.paper p{margin:0 0 1.2em}
.paper .body{text-align:justify}
.paper .sig{margin-top:4.6em;margin-bottom:0}
.paper mark{background:#fde7ec;color:var(--accent);padding:0 .15em;border-radius:2px}
.cap{font-size:14px;color:var(--muted);margin-top:10px;text-align:center}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}.paperwrap{position:static}.paper{font-size:clamp(9px,2.4vw,15px)}}
@media(max-width:480px){.row{grid-template-columns:minmax(0,1fr)}form{padding:18px}}
</style>
</head>
<body>
<header>
  <h1>Surat Fit To Fly</h1>
  <p>Isi data pasien, periksa pratinjau, lalu buat PDF.</p>
</header>
<main>
  <form id="frm" autocomplete="off" novalidate>
    <div class="f"><label for="tglSurat">Tanggal surat</label><input type="date" id="tglSurat" required></div>
    <div class="f"><label for="nama">Nama pasien</label><input type="text" id="nama" placeholder="Nama lengkap" required></div>
    <div class="row">
      <div class="f"><label for="tglLahir">Tanggal lahir</label><input type="date" id="tglLahir" required></div>
      <div class="f"><label for="mr">No. MR</label><input type="text" id="mr" inputmode="numeric" required></div>
    </div>
    <div class="row">
      <div class="f"><label for="hpht">HPHT</label><input type="date" id="hpht" required></div>
      <div class="f"><label for="tp">Taksiran persalinan</label><input type="date" id="tp" required><div class="hint">Otomatis dari HPHT, bisa diubah</div></div>
    </div>
    <div class="calc" id="calc">Usia kehamilan: <b>-</b></div>
    <div class="row">
      <div class="f"><label for="fly1">Tanggal terbang</label><input type="date" id="fly1" required></div>
      <div class="f"><label for="fly2">Tanggal terbang 2</label><input type="date" id="fly2"><div class="hint">Opsional, misalnya tanggal pulang</div></div>
    </div>
    <div id="warn"></div>
    <button type="submit" id="btn">Buat &amp; simpan PDF</button>
    <button type="button" class="ghost" id="reset">Kosongkan formulir</button>
    <div id="status" role="status"></div>
  </form>
  <div class="paperwrap">
    <div class="paper" id="paper"></div>
    <div class="cap">Pratinjau A4. Bagian berwarna adalah data yang Anda isi.</div>
  </div>
</main>
<script>
{
const $=id=>document.getElementById(id);
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOCTOR='Dr. Made Surya Kumara, SpOG', ROLE='Obstetrician and Gynecologist', PHONE='+62 81533333532';
const DAY=86400000;
const parse=v=>{if(!v)return null;const[a,b,c]=v.split('-').map(Number);return Date.UTC(a,b-1,c)};
const fmt=t=>{const d=new Date(t);return d.getUTCDate()+' '+MONTHS[d.getUTCMonth()]+' '+d.getUTCFullYear()};
const iso=t=>new Date(t).toISOString().slice(0,10);
const naegele=t=>{const d=new Date(t+7*DAY);d.setUTCMonth(d.getUTCMonth()+9);return d.getTime()};
const today=()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())};
let tpAuto=true;

function ga(lmp,ref){if(lmp==null||ref==null)return null;const d=Math.round((ref-lmp)/DAY);if(d<0)return null;const w=Math.floor(d/7),r=d%7;return {w,r,text:w+' weeks'+(r?' '+r+(r>1?' days':' day'):'')}}

function data(){
  const v={surat:parse($('tglSurat').value),nama:$('nama').value.trim(),lahir:parse($('tglLahir').value),mr:$('mr').value.trim(),hpht:parse($('hpht').value),tp:parse($('tp').value),f1:parse($('fly1').value),f2:parse($('fly2').value)};
  v.ga=ga(v.hpht,v.surat);
  v.flights=[v.f1,v.f2].filter(x=>x!=null).sort((a,b)=>a-b).map(fmt).join(' and ');
  return v;
}

function paragraph(v,m){
  const g=(x,ph)=>x?m(x):'['+ph+']';
  return 'This is to certify that '+g(v.nama.toUpperCase(),'NAMA')+' date of birth '+g(v.lahir!=null&&fmt(v.lahir),'tanggal lahir')+', medical record number '+g(v.mr,'No. MR')+', came to my office to check up on her pregnancy. She has no complaints about her pregnancy. Her last period was on '+g(v.hpht!=null&&fmt(v.hpht),'HPHT')+' and the estimated due date will be on '+g(v.tp!=null&&fmt(v.tp),'taksiran persalinan')+'. Her pregnancy is a single-live fetus, '+g(v.ga&&v.ga.text,'usia kehamilan')+' gestational age with a good and healthy condition. Her vital signs are normal and her pregnancy is in good condition. She is fit to fly on '+g(v.flights,'tanggal terbang')+'.';
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function warnings(v){
  const w=[];
  if(v.lahir!=null&&v.surat!=null){const age=(v.surat-v.lahir)/(365.25*DAY);if(age<12||age>55)w.push('Usia pasien '+Math.floor(age)+' tahun. Periksa kembali tanggal lahir.')}
  if(v.hpht!=null&&v.surat!=null&&v.hpht>v.surat)w.push('HPHT jatuh setelah tanggal surat.');
  if(v.hpht!=null&&v.tp!=null&&Math.abs(v.tp-naegele(v.hpht))>7*DAY)w.push('Taksiran persalinan berbeda lebih dari 7 hari dari hitungan Naegele ('+fmt(naegele(v.hpht))+').');
  if(v.ga&&v.ga.w>=36)w.push('Usia kehamilan 36 minggu atau lebih: kebanyakan maskapai tidak menerima penumpang hamil tunggal setelah usia ini.');
  [v.f1,v.f2].forEach(f=>{if(f!=null&&v.surat!=null&&f<v.surat)w.push('Tanggal terbang '+fmt(f)+' sebelum tanggal surat.')});
  return w;
}

function render(){
  const v=data();
  $('calc').innerHTML='Usia kehamilan pada tanggal surat: <b>'+(v.ga?esc(v.ga.text):'-')+'</b>';
  const m=x=>'<mark>'+esc(x)+'</mark>';
  $('paper').innerHTML='<h2>FIT TO FLY LETTER</h2><p>'+(v.surat!=null?m(fmt(v.surat)):'[tanggal surat]')+'</p><p>To whom it may concern,</p><p class="body">'+paragraph(v,m)+'</p><p>Please contact me at '+PHONE+' if you have any questions.</p><p>Yours sincerely,</p><p class="sig">'+DOCTOR+'<br>'+ROLE+'</p>';
  const w=warnings(v);const box=$('warn');
  box.style.display=w.length?'block':'none';box.innerHTML=w.length?'<ul>'+w.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';
}

/* ---- minimal PDF writer: A4, Helvetica, justified paragraph ---- */
const HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const cw=c=>{const k=c.charCodeAt(0);return k>=32&&k<=126?HW[k-32]:556};
const width=(s,size)=>[...s].reduce((a,c)=>a+cw(c),0)*size/1000;
const pstr=s=>[...s].map(c=>{const k=c.charCodeAt(0);if(c==='\\'||c==='('||c===')')return '\\'+c;if(k>=32&&k<=126)return c;if(k<=255)return '\\'+k.toString(8).padStart(3,'0');return '?'}).join('');

function wrap(text,size,maxW){
  const words=text.split(/\s+/);const lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(width(t,size)<=maxW||!cur)cur=t;else{lines.push(cur);cur=w}}
  if(cur)lines.push(cur);return lines;
}

function buildPdf(v){
  const W=595.28,H=841.89,L=72,TW=W-144,FS=11,LEAD=18.5;
  let c='';
  const line=(s,x,y,tw)=>{c+='BT /F1 '+FS+' Tf '+(tw?tw.toFixed(3):0)+' Tw 1 0 0 1 '+x.toFixed(2)+' '+y.toFixed(2)+' Tm ('+pstr(s)+') Tj ET\n'};
  const title='FIT TO FLY LETTER';const tsz=12;const tw=8501*tsz/1000;
  let y=H-100;
  c+='BT /F2 '+tsz+' Tf 1 0 0 1 '+((W-tw)/2).toFixed(2)+' '+y+' Tm ('+title+') Tj ET\n';
  y-=50;line(fmt(v.surat),L,y);
  y-=31;line('To whom it may concern,',L,y);
  y-=31;
  const lines=wrap(paragraph(v,x=>x),FS,TW);
  lines.forEach((s,i)=>{const sp=(s.match(/ /g)||[]).length;const last=i===lines.length-1;line(s,L,y,(!last&&sp)?(TW-width(s,FS))/sp:0);y-=LEAD});
  y-=12.5;line('Please contact me at '+PHONE+' if you have any questions.',L,y);
  y-=31;line('Yours sincerely,',L,y);
  y-=95;line(DOCTOR,L,y);
  y-=LEAD;line(ROLE,L,y);
  const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>',
    '<< /Length '+c.length+' >>\nstream\n'+c+'endstream',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
    '<< /Title ('+pstr('Fit To Fly - '+v.nama)+') /Author ('+pstr(DOCTOR)+') /Producer (Fit To Fly form) >>'];
  let out='%PDF-1.4\n';const off=[];
  objs.forEach((o,i)=>{off.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});
  const x=out.length;
  out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+off.map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('');
  out+='trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R /Info 7 0 R >>\nstartxref\n'+x+'\n%%EOF\n';
  const b=new Uint8Array(out.length);for(let i=0;i<out.length;i++)b[i]=out.charCodeAt(i)&255;return b;
}

const status=t=>{$('status').textContent=t};

async function savePdf(bytes,name){
  const blob=new Blob([bytes],{type:'application/pdf'});
  if(window.claude&&typeof window.claude.use==='function'){
    try{const d=await window.claude.use('downloads');
      if(d){await d.save({filename:name,data:blob});status('PDF disimpan: '+name);return}
    }catch(e){if(e&&e.code==='declined'){status('Penyimpanan dibatalkan.');return}if(e&&e.code==='rate_limited'){status('Masih ada jendela simpan yang terbuka. Coba lagi sebentar.');return}}
  }
  try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);status('PDF diunduh: '+name)}
  catch(e){status('Browser ini tidak mengizinkan unduhan dari halaman ini.')}
}

$('hpht').addEventListener('input',()=>{const h=parse($('hpht').value);if(h!=null&&(tpAuto||!$('tp').value)){$('tp').value=iso(naegele(h));tpAuto=true}render()});
$('tp').addEventListener('input',()=>{tpAuto=false;render()});
$('frm').addEventListener('input',render);
$('reset').addEventListener('click',()=>{$('frm').reset();$('tglSurat').value=iso(today());tpAuto=true;status('');render()});
$('frm').addEventListener('submit',e=>{
  e.preventDefault();
  const v=data();
  const miss=[['surat','Tanggal surat'],['nama','Nama pasien'],['lahir','Tanggal lahir'],['mr','No. MR'],['hpht','HPHT'],['tp','Taksiran persalinan'],['f1','Tanggal terbang']].filter(([k])=>v[k]==null||v[k]==='').map(([,n])=>n);
  if(miss.length){status('Belum diisi: '+miss.join(', ')+'.');return}
  if(!v.ga){status('HPHT harus sebelum tanggal surat.');return}
  savePdf(buildPdf(v),'Fit To Fly - '+v.nama.replace(/[\\/:*?"<>|]/g,'')+'.pdf');
});
$('tglSurat').value=iso(today());
render();
}
</script>
</body>
</html>
